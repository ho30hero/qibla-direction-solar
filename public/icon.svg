<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A485F" />
      <stop offset="100%" stop-color="#073546" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="terracottaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F04D23" />
      <stop offset="100%" stop-color="#c23b18" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)" />
  
  <!-- Outer Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="6" stroke-dasharray="12 8" />
  <circle cx="256" cy="256" r="150" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2" />
  
  <!-- Compass Cardinal Ticks -->
  <line x1="256" y1="60" x2="256" y2="90" stroke="#F04D23" stroke-width="6" stroke-linecap="round" />
  <line x1="256" y1="422" x2="256" y2="452" stroke="rgba(255,255,255,0.4)" stroke-width="4" stroke-linecap="round" />
  <line x1="60" y1="256" x2="90" y2="256" stroke="rgba(255,255,255,0.4)" stroke-width="4" stroke-linecap="round" />
  <line x1="422" y1="256" x2="452" y2="256" stroke="rgba(255,255,255,0.4)" stroke-width="4" stroke-linecap="round" />

  <!-- Sun Rays & Alignment Symbol -->
  <circle cx="256" cy="256" r="64" fill="none" stroke="url(#goldGrad)" stroke-width="8" />
  <circle cx="256" cy="256" r="28" fill="url(#goldGrad)" />
  
  <!-- Qibla Arrow Pointer -->
  <polygon points="256,105 285,256 256,236 227,256" fill="url(#terracottaGrad)" />
  <polygon points="256,407 285,256 256,276 227,256" fill="rgba(255,255,255,0.8)" />
  
  <!-- Center Pivot -->
  <circle cx="256" cy="256" r="12" fill="#ffffff" stroke="#0A485F" stroke-width="4" />
</svg>
